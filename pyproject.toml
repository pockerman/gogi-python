[project]
name = "gogi-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.80.0",
    "protobuf>=5.26,<6",
    "grpcio-tools==1.71.0",
    "pydantic>=2.13.4",
    "loguru>=0.7.3",
]
[tool.setuptools]
package-dir = {"" = "src"}

[tool.uv.extra-build-dependencies]
grpcio-tools = ["pkg_resources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "C4"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "ruff>=0.14.0",
    "pre-commit>=4.0.0",
]
