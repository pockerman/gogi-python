name: Conventional Commits

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  commitlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages follow Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PATTERN='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9_.-]+\))?!?: .{1,100}$'
          invalid=0

          git log --no-merges --format='%H %s' "${BASE_SHA}..${HEAD_SHA}" > commits.txt

          while IFS= read -r line; do
            sha="${line%% *}"
            subject="${line#* }"
            if ! echo "$subject" | grep -qE "$PATTERN"; then
              echo "::error::Commit $sha does not follow Conventional Commits: \"$subject\""
              invalid=1
            fi
          done < commits.txt

          rm -f commits.txt
          exit "$invalid"
