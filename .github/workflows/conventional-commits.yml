name: Conventional Commits

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  commitlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
